<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DiagnoPink - Breast Cancer Detection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.4.1/dist/flowbite.min.js"></script>
    <script src="https://unpkg.com/framer-motion/dist/framer-motion.umd.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .main-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 2rem;
            max-width: 1000px;
            width: 95%;
            animation: fadeIn 0.6s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .feature-input {
            border-radius: 12px;
            border: 1px solid #ddd;
            transition: all 0.3s;
        }
        .feature-input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 8px rgba(79,172,254,0.4);
        }
        .btn-primary {
            background: #4facfe;
            border: none;
            border-radius: 12px;
            padding: 12px 25px;
            font-size: 1.2rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(79,172,254,0.4);
        }
        h1 {
            font-weight: 700;
            color: #333;
        }
    </style>
</head>
<body>
<div class="main-card">
    <h1 class="text-center mb-4">🔍 DiagnoPink</h1>
    <form action="/predict" method="post">
        <div class="row">
            {% for i in range(feature_names|length) %}
            <div class="col-md-4 mb-3">
                <input type="number" step="any" name="feature_{{ i }}" placeholder="{{ feature_names[i] | capitalize }}" class="form-control feature-input" required>
            </div>
            {% endfor %}
        </div>
        <div class="text-center">
            <button type="submit" class="btn btn-primary">Predict</button>
        </div>
    </form>
</div>
</body>
</html>
