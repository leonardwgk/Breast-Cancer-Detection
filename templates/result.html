<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DiagnoPink - Result</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .result-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 2rem;
            max-width: 500px;
            width: 95%;
            text-align: center;
            animation: fadeIn 0.6s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-text {
            font-size: 2rem;
            font-weight: bold;
            color: #333;
        }
        .btn-secondary {
            background: #4facfe;
            border: none;
            border-radius: 12px;
            padding: 10px 20px;
            font-size: 1.1rem;
            margin-top: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-secondary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(79,172,254,0.4);
        }
    </style>
</head>
<body>
<div class="result-card">
    <h2 class="mb-4">Prediction Result</h2>
    <p class="result-text">{{ result }}</p>
    {% if proba %}
    <div class="progress mt-4" style="height: 25px; border-radius: 12px;">
        <div class="progress-bar bg-success" role="progressbar" style="width: {{ proba }}%;" aria-valuenow="{{ proba }}" aria-valuemin="0" aria-valuemax="100">
            {{ proba|round(2) }}%
        </div>
    </div>
    {% endif %}
    <a href="/" class="btn btn-secondary">Back</a>
</div>
</body>
</html>
